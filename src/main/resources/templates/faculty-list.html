<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>School of IT Faculty Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <header class="mb-4">
        <p class="text-uppercase text-primary fw-semibold mb-1">University of Cincinnati</p>
        <h1 class="h2">School of IT Faculty Directory</h1>
        <p class="text-secondary mb-0">Browse faculty contact information.</p>
    </header>
    <div class="table-responsive bg-white shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr><th scope="col">ID</th><th scope="col">First Name</th><th scope="col">Last Name</th><th scope="col">Title</th><th scope="col">Email</th></tr>
            </thead>
            <tbody>
            <tr th:each="faculty : ${theFaculties}">
                <td th:text="${faculty.id}">1</td>
                <td th:text="${faculty.firstName}">Alex</td>
                <td th:text="${faculty.lastName}">Morgan</td>
                <td th:text="${faculty.title}">Professor</td>
                <td><a th:href="'mailto:' + ${faculty.email}" th:text="${faculty.email}">faculty@example.edu</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
